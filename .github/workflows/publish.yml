name: Publish

# Releasing is `git tag vX.Y.Z && git push --tags`. PyPI authenticates this
# workflow through OIDC (Trusted Publishing), so no API token exists to leak.
on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(python -c "import sys; sys.path.insert(0, 'src'); import syncanything; print(syncanything.__version__)")
          if [ "$tag" != "$packaged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $packaged" >&2
            exit 1
          fi
          echo "Releasing $packaged"

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests

  publish:
    needs: test
    runs-on: ubuntu-latest
    # The environment is what the PyPI publisher is bound to, and where a
    # required reviewer can be added later to gate releases.
    environment:
      name: pypi
      url: https://pypi.org/p/syncanything
    permissions:
      # Mints the short-lived OIDC token PyPI verifies. Nothing is stored.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          # There is no lockfile to key a cache on, and the build needs no
          # dependencies, so caching would only warn about never invalidating.
          enable-cache: false

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
